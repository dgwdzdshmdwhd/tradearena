# Render-Blueprint fuer TradeArena.
#
# Damit muss man auf render.com nichts von Hand einstellen: "New" ->
# "Blueprint" -> Repository auswaehlen. Render liest diese Datei und legt
# Webdienst und Datenbank an.
#
# Beide sind im kostenlosen Tarif. Zwei Dinge musst du wissen:
#   1. Der Webdienst schlaeft nach 15 Minuten ohne Aufrufe ein. Der Cron-Ping
#      aus DEPLOY.md haelt ihn wach.
#   2. Die kostenlose Postgres-Datenbank laeuft nach 30 Tagen ab. Render
#      erinnert dich per Mail; eine neue anlegen dauert zwei Minuten.

services:
  - type: web
    name: tradearena
    runtime: node
    plan: free
    region: frankfurt
    # Zwei Fallstricke stecken in dieser einen Zeile:
    #
    # 1. `rm -f package-lock.json`: Die Lockfile entsteht auf einem
    #    Windows-Rechner. npm installiert danach auf Linux zwar nach Lockfile,
    #    laesst aber die plattformabhaengigen Binaerpakete weg (lightningcss,
    #    esbuild, rollup) - obwohl deren Linux-Eintraege in der Lockfile
    #    stehen. Der Build stirbt dann mit "Cannot find module
    #    ../lightningcss.linux-x64-gnu.node". Bekannter npm-Fehler, und der
    #    empfohlene Ausweg ist genau dieser: ohne Lockfile aufloesen lassen.
    #
    # 2. `--include=dev`: Weiter unten steht NODE_ENV=production, und dann
    #    laesst npm die devDependencies weg. Vite und Tailwind stehen aber
    #    genau dort.
    buildCommand: rm -f package-lock.json && npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Bewusst KEINE feste Node-Version: eine Version, die es auf Render
      # nicht gibt, laesst den Deploy sofort scheitern. Die Anforderung steht
      # in package.json unter "engines", das reicht.
      - key: NODE_ENV
        value: production
      # Wird von Render automatisch erzeugt - niemand muss ihn kennen.
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tradearena-db
          property: connectionString
      - key: BINANCE_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,PEPEUSDT,BNBUSDT

databases:
  - name: tradearena-db
    plan: free
    region: frankfurt
