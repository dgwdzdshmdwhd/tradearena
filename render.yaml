# Render-Blueprint fuer TradeArena.
#
# Damit muss man auf render.com nichts von Hand einstellen: "New" ->
# "Blueprint" -> Repository auswaehlen. Render liest diese Datei und legt
# Webdienst und Datenbank an.
#
# Beide sind im kostenlosen Tarif. Zwei Dinge musst du wissen:
#   1. Der Webdienst schlaeft nach 15 Minuten ohne Aufrufe ein. Der Cron-Ping
#      aus DEPLOY.md haelt ihn wach.
#   2. Die kostenlose Postgres-Datenbank laeuft nach 30 Tagen ab. Render
#      erinnert dich per Mail; eine neue anlegen dauert zwei Minuten.

services:
  - type: web
    name: tradearena
    runtime: node
    plan: free
    region: frankfurt
    # Drei Fallstricke stecken in dieser einen Zeile. Alle drei haben hier
    # schon einen Deploy gekostet:
    #
    # 1. `rm -rf node_modules`: Render stellt zwischen Builds einen Cache
    #    wieder her. Findet npm darin einen scheinbar fertigen Baum, tut es
    #    praktisch nichts ("removed 1 package in 541ms") - und die fehlenden
    #    Linux-Binaerdateien bleiben fehlend. Ohne dieses rm laeuft der Build
    #    genau einmal durch, naemlich beim allerersten Mal ohne Cache.
    #
    # 2. `rm -f package-lock.json`: Die Lockfile entsteht auf einem
    #    Windows-Rechner. npm installiert danach auf Linux zwar nach Lockfile,
    #    laesst aber die plattformabhaengigen Binaerpakete weg (lightningcss,
    #    esbuild, rollup) - obwohl deren Linux-Eintraege darin stehen.
    #
    # 3. `--include=dev`: Weiter unten steht NODE_ENV=production, und dann
    #    laesst npm die devDependencies weg. Vite und Tailwind stehen aber
    #    genau dort.
    buildCommand: >-
      rm -rf node_modules apps/web/node_modules apps/server/node_modules
      packages/core/node_modules package-lock.json &&
      npm install --include=dev --no-audit --no-fund &&
      npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Bewusst KEINE feste Node-Version: eine Version, die es auf Render
      # nicht gibt, laesst den Deploy sofort scheitern. Die Anforderung steht
      # in package.json unter "engines", das reicht.
      - key: NODE_ENV
        value: production
      # Wird von Render automatisch erzeugt - niemand muss ihn kennen.
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tradearena-db
          property: connectionString
      - key: BINANCE_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,PEPEUSDT,BNBUSDT

databases:
  - name: tradearena-db
    plan: free
    region: frankfurt
